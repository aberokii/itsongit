# Daily @itsongit reels, made and scheduled on GitHub's servers (works with the laptop shut).
# One run a day makes 3 reels for the A/B tests (data/experiments.json): pipeline/plan.py assigns each reel a
# posting window (midday 11:05–12:50, evening 18:00–19:50, night 21:00–22:50 Berlin), a hook arm and a topic arm.
# Cron is UTC. GitHub often starts scheduled runs hours late (Nov 2026: 7-9 h, so the midday window was lost), and
# delays are worst on :00/:30. So there are two starts: 02:17 UTC (03:17 Berlin winter / 04:17 summer) and a backup
# at 05:47 UTC (06:47 / 07:47). The "gate" job skips a daily run when main already has today's "reels: DATE" commit,
# so whichever run starts first makes the reels and the other does nothing. A Claude scheduled task also checks at
# 09:41 Berlin and starts a "daily" run by hand if neither has made today's reels.
# Run it by hand: Actions → reels → Run workflow. mode "daily" = the planned 3 (rows whose window has passed are
# skipped); mode "one-now" = a single reel in the chosen format, published immediately (outside the A/B plan).
name: reels

on:
  schedule:
    - cron: "17 2 * * *"   # main run
    - cron: "47 5 * * *"   # backup, skipped by the gate if the main run already made today's reels
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = the planned 3 reels · one-now = one reel, posted right away"
        type: choice
        options: [daily, one-now]
        default: daily
      format:
        description: "format for one-now"
        type: choice
        options: [story, classic]
        default: story

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - id: check
        run: |
          TODAY=$(TZ=Europe/Berlin date +%F)
          git fetch -q origin main
          if [ "${{ inputs.mode || 'daily' }}" = daily ] && git log origin/main --since=36.hours --format=%s | grep -qx "reels: $TODAY"; then
            echo "Today's reels ($TODAY) are already made: skipping this run."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  reels:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      ZERNIO_INSTAGRAM_ACCOUNT_ID: ${{ secrets.ZERNIO_INSTAGRAM_ACCOUNT_ID }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Day
        run: |
          echo "RUN=${{ inputs.mode || 'daily' }}" >> "$GITHUB_ENV"
          echo "FORMAT=${{ inputs.format || 'story' }}" >> "$GITHUB_ENV"
          echo "TODAY=$(TZ=Europe/Berlin date +%F)" >> "$GITHUB_ENV"

      - name: Check secrets
        run: |
          for v in ZERNIO_API_KEY ZERNIO_INSTAGRAM_ACCOUNT_ID CLAUDE_CODE_OAUTH_TOKEN; do
            [ -n "${!v}" ] || { echo "::error::secret $v is not set (repo Settings → Secrets and variables → Actions)"; exit 1; }
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache
            ~/.local/share/fonts
            pipeline/.venv
            studio/node_modules
            capture/node_modules
            .remotion
          key: tools-${{ runner.os }}-${{ hashFiles('pipeline/uv.lock', 'studio/package-lock.json', 'capture/package-lock.json', 'scripts/bootstrap.sh') }}

      - name: Bootstrap
        run: bash scripts/bootstrap.sh

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Make and schedule reels
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          git config user.name "itsongit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$RUN" = one-now ]; then PROMPT=$(envsubst '${TODAY} ${FORMAT}' < .github/prompts/one-now.md)
          else PROMPT=$(envsubst '${TODAY}' < .github/prompts/reels.md); fi
          claude -p "$PROMPT" --model claude-opus-5-5 --dangerously-skip-permissions \
            --output-format stream-json --verbose > claude.jsonl || echo "::warning::claude exited non-zero"
          jq -r 'select(.type=="result") | .result' claude.jsonl | tee report.md
          { echo "## itsongit $RUN run · $TODAY"; echo; cat report.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Experiment report
        if: always()
        run: |
          python3 pipeline/experiments.py > /dev/null 2>&1 || { echo "::warning::experiments report failed"; exit 0; }
          { echo; cat data/experiments/report.md; } >> "$GITHUB_STEP_SUMMARY"
          git add data/experiments/report.md
          git diff --cached --quiet || { git commit -m "experiments: report $TODAY" && git pull --rebase && git push; }

      - name: Upload reels and QA sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reels-${{ env.TODAY }}-${{ env.RUN }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            videos/*/FINAL*.mp4
            videos/*/FINAL_thumbnail.png
            videos/*/verify/row*.png
            videos/*/verify/thumb.png
            claude.jsonl
