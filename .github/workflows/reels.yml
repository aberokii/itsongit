# Daily @itsongit reels, made and scheduled on GitHub's servers (works with the laptop shut).
# One run a day makes 3 reels for the A/B tests (data/experiments.json): pipeline/plan.py assigns each reel a
# posting window (midday 11:05–12:50, evening 18:00–19:50, night 21:00–22:50 Berlin), a hook arm and a topic arm.
# Cron is UTC: 04:30 is 06:30 Berlin in summer time and 05:30 in winter time, well before the first window.
# Run it by hand: Actions → reels → Run workflow (rows whose window has already passed are skipped).
name: reels

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      ZERNIO_INSTAGRAM_ACCOUNT_ID: ${{ secrets.ZERNIO_INSTAGRAM_ACCOUNT_ID }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Day
        run: |
          echo "RUN=daily" >> "$GITHUB_ENV"
          echo "TODAY=$(TZ=Europe/Berlin date +%F)" >> "$GITHUB_ENV"

      - name: Check secrets
        run: |
          for v in ZERNIO_API_KEY ZERNIO_INSTAGRAM_ACCOUNT_ID CLAUDE_CODE_OAUTH_TOKEN; do
            [ -n "${!v}" ] || { echo "::error::secret $v is not set (repo Settings → Secrets and variables → Actions)"; exit 1; }
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache
            ~/.local/share/fonts
            pipeline/.venv
            studio/node_modules
            capture/node_modules
            .remotion
          key: tools-${{ runner.os }}-${{ hashFiles('pipeline/uv.lock', 'studio/package-lock.json', 'capture/package-lock.json', 'scripts/bootstrap.sh') }}

      - name: Bootstrap
        run: bash scripts/bootstrap.sh

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Make and schedule reels
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          git config user.name "itsongit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PROMPT=$(envsubst '${TODAY}' < .github/prompts/reels.md)
          claude -p "$PROMPT" --model claude-opus-5-5 --dangerously-skip-permissions \
            --output-format stream-json --verbose > claude.jsonl || echo "::warning::claude exited non-zero"
          jq -r 'select(.type=="result") | .result' claude.jsonl | tee report.md
          { echo "## itsongit $RUN run · $TODAY"; echo; cat report.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Experiment report
        if: always()
        run: |
          python3 pipeline/experiments.py > /dev/null 2>&1 || { echo "::warning::experiments report failed"; exit 0; }
          { echo; cat data/experiments/report.md; } >> "$GITHUB_STEP_SUMMARY"
          git add data/experiments/report.md
          git diff --cached --quiet || { git commit -m "experiments: report $TODAY" && git pull --rebase && git push; }

      - name: Upload reels and QA sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reels-${{ env.TODAY }}-${{ env.RUN }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            videos/*/FINAL*.mp4
            videos/*/FINAL_thumbnail.png
            videos/*/verify/row*.png
            videos/*/verify/thumb.png
            claude.jsonl
